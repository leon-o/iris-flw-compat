plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    flatDir {
        dirs 'libs'
    }
    maven { url = "https://maven.parchmentmc.org" }
    maven {
        name "tterrag maven"
        url "https://maven.tterrag.com/"
    }
    maven { url "https://maven.createmod.net"}
    maven {
        url "https://cursemaven.com"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://maven.blamejared.com"
    }
    maven {
        name "createmod maven"
        url "https://maven.createmod.net/"
    }
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
}

base {
    archivesName = neoforge_archives_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

dependencies {
    compileOnly("maven.modrinth:iris:$iris_version-neoforge")
    compileOnly("maven.modrinth:sodium:${sodium_version}-neoforge")
    //  compileOnly("dev.engine-room.flywheel:flywheel-fabric-${flywheel_minecraft_version}:${flywheel_fabric_version}")

    implementation("io.github.douira:glsl-transformer:2.0.1")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-${flywheel_minecraft_version}:${flywheel_neoforge_version}")

    /*
     * [JarJar Compatibility Hack]
     * * RATIONALE:
     * There is a version conflict with the 'Vanillin' mod (also by the Flywheel author).
     * Because Vanillin is part of the same monorepo, its internal JarJar metadata
     * refers to Flywheel using the artifact ID "neoforge" instead of the
     * community-standard "flywheel-neoforge-1.21.1".
     * * ISSUE:
     * NeoForge's JarJar system treats these as two different libraries, causing
     * it to load both 1.0.4 (from Vanillin) and 1.0.6 (ours) simultaneously.
     * This leads to a mod loading crash as our mod requires [1.0.6,).
     * * SOLUTION:
     * We use a local copy of Flywheel 1.0.6 located in /libs, renamed to
     * "neoforge-1.0.6.jar" to match Vanillin's identifier. This forces
     * JarJar to perform version negotiation, correctly selecting our 1.0.6
     * as the higher version.
     *
     * NOTICE: The libs/neoforge.jar is actually a copy of the flywheel-neoforge-1.0.6.jar, just renamed to "neoforge.jar" to work around the JarJar version conflict with Vanillin.
     */
    jarJar(group: 'dev.engine-room.flywheel', name: 'neoforge', version: '1.0.6')

    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${flywheel_minecraft_version}:${flywheel_neoforge_version}")
    compileOnly("maven.modrinth:iris:${iris_version}-neoforge")
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")

    runtimeOnly("io.github.douira:glsl-transformer:2.0.1")
    runtimeOnly("maven.modrinth:iris:${iris_version}-neoforge")
    runtimeOnly("maven.modrinth:sodium:${sodium_version}-neoforge")
    runtimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    runtimeOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${flywheel_minecraft_version}:${flywheel_neoforge_version}")
    runtimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            // , 'mixin.debug.export'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {

        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {

}


var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

